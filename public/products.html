<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopFlow E-Commerce - Products</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Global Header & Main Navigation Bar -->
<header>
  <nav aria-label="Main navigation">
    <a class="logo" href="index.html">ShopFlow</a>
    <a href="index.html">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="products.html" aria-current="page">
      <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Products
    </a>
    <a href="shoppingCart.html">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Shopping Cart
    </a>
    <a href="stock.html">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      Stock
    </a>
    <a href="orders.html">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Orders
    </a>
    <a href="login.html">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Login
    </a>
  </nav>
</header>

<main>
  <section id="products">
    <h2>Products</h2>

    <div class="cart-button-wrapper">
      <a class="cart-button" href="shoppingCart.html">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        Go to Shopping Cart
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>

    <!-- Filter Bar with Real-time Currency Converter Selector -->
    <div class="filter-container">
      <label for="search">Search Products:</label>
      <input type="text" id="search" placeholder="Search products by name..." aria-label="Search products by name">

      <label for="categoryFilter">Category:</label>
      <select id="categoryFilter" aria-label="Filter products by category">
        <option value="">All Categories</option>
        <option value="Electronics">Electronics</option>
        <option value="Fashion">Fashion</option>
        <option value="Accessories">Accessories</option>
        <option value="Sports">Sports</option>
      </select>

      <!-- Currency Conversion Gateway Control -->
      <label for="currencySelect">Currency:</label>
      <select id="currencySelect" aria-label="Select display currency">
        <option value="MYR">MYR (RM)</option>
        <option value="USD">USD ($)</option>
        <option value="EUR">EUR (€)</option>
        <option value="GBP">GBP (£)</option>
        <option value="SGD">SGD (S$)</option>
      </select>
    </div>

    <p id="message" role="status" aria-live="polite"></p>

    <div id="productList" class="grid"></div>
  </section>
</main>

<footer>
  <p>&copy; 2026 ShopFlow E-Commerce</p>
</footer>

<script src="script.js"></script>
</body>
</html>
