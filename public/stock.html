<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopFlow E-Commerce - Stock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Global Site Header & Navigation -->
<header>
  <nav aria-label="Main navigation">
    <a class="logo" href="index.html">ShopFlow</a>
    <!-- Home Navigation Link -->
    <a href="index.html">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <!-- Products Catalog Link -->
    <a href="products.html">
      <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Products
    </a>
    <!-- Shopping Cart Link -->
    <a href="shoppingCart.html">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Shopping Cart
    </a>
    <!-- Stock Management Link (Active Page) -->
    <a href="stock.html" aria-current="page">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      Stock
    </a>
    <!-- Orders Management Link -->
    <a href="orders.html">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Orders
    </a>
    <!-- User Authentication Link -->
    <a href="login.html">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Login
    </a>
  </nav>
</header>

<!-- Main Inventory & Product CRUD Management Section -->
<main>
  <section id="admin">
    <h2>Stock Management</h2>
    <p>Products with stock below 5 are highlighted as low stock.</p>

    <!-- Product CRUD Operation Form -->
    <form id="productForm" class="card">
      <!-- Search/Update Identifier Input -->
      <label for="productId">Product ID (Required for Read/Update/Delete)</label>
      <input type="number" id="productId" min="1" placeholder="Enter Product ID to Search/Update">

      <!-- Product Details Inputs -->
      <label for="productName">Product name</label>
      <input id="productName" required placeholder="Enter product name">
      
      <label for="category">Category</label>
      <select id="category" required>
        <option value="" disabled selected>Select Category</option>
        <option value="Electronics">Electronics</option>
        <option value="Fashion">Fashion</option>
        <option value="Accessories">Accessories</option>
        <option value="Sports">Sports</option>
      </select>

      <label for="price">Price (RM)</label>
      <input id="price" type="number" min="0.01" step="0.01" required placeholder="e.g. 19.99">
      
      <label for="stock">Stock</label>
      <input id="stock" type="number" min="0" step="1" required placeholder="e.g. 10">

      <label for="imageUrl">Image File Name / URL</label>
      <input id="imageUrl" placeholder="e.g. Headphones.jpg">

      <!-- CRUD Action Triggers -->
      <div class="button-group">
        <button type="submit" id="createBtn">Create Product</button>
        <button type="button" id="readBtn">Read Product</button>
        <button type="button" id="updateBtn">Update Product</button>
        <button type="button" id="deleteBtn">Delete Product</button>
        <button type="button" id="cancelEdit">Cancel</button>
      </div>
    </form>

    <!-- Dynamic Alert/Status Feedback Message Container -->
    <p id="message" role="status" aria-live="polite"></p>

    <!-- Target Container for Dynamic Stock Table Rendering -->
    <div id="stockTable"></div>
  </section>
</main>

<!-- Global Footer -->
<footer>
  <p>&copy; 2026 ShopFlow E-Commerce</p>
</footer>

<!-- Application Logic -->
<script src="script.js"></script>
</body>
</html>
